name: C++ CI — Namma Metro Routing Engine

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu 24.04, GCC-13)
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install system deps ────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # GoogleTest is NOT installed from apt: CMakeLists fetches and builds
          # v1.14.0 via FetchContent, so libgtest-dev would be unused. valgrind
          # was likewise installed but never invoked by any step. Both removed.
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-13 \
            g++-13 \
            python3
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # ── 3. Generate synthetic GTFS data ───────────────────────────────────
      # Without GTFS data the benchmark falls through to the 10-node fallback
      # graph hardcoded in main_bench.cpp, and a green badge earned that way
      # proves nothing about the parser or the graph builder. Generating a feed
      # here forces CI through the full parsing pipeline.
      - name: Generate synthetic GTFS test data
        run: |
          mkdir -p data
          python3 scripts/generate_synthetic_gtfs.py data
          echo "Generated GTFS files:"
          ls -lh data/

      # ── 4. Validate GTFS data completeness ───────────────────────────────
      - name: Validate required GTFS files present
        run: |
          for f in agency.txt stops.txt routes.txt trips.txt stop_times.txt calendar.txt; do
            if [ ! -f "data/$f" ]; then
              echo "FATAL: Missing required GTFS file: data/$f"
              exit 1
            fi
          done
          echo "All required GTFS files present."
          # transfers.txt is optional. The synthetic feed has no platforms so it
          # produces none, and the engine must stay fully functional without it —
          # that path is covered by TransferLayer.AbsentByDefault_GraphIsUnchanged.
          if [ -f data/transfers.txt ]; then
            echo "transfers.txt present ($(( $(wc -l < data/transfers.txt) - 1 )) rows)"
          else
            echo "transfers.txt absent (expected for the synthetic feed)"
          fi

      # ── 4b. Smoke-test the normaliser's --transfers path ─────────────────
      # The transfer layer's C++ side is covered by tests/test_transfers.cpp, but
      # the generation of transfers.txt lives in Python and ctest cannot reach it.
      # This builds a minimal two-platform feed and asserts the normaliser emits
      # both directions with the feed time where given and the default elsewhere.
      - name: Test normalize_gtfs.py --transfers
        run: |
          mkdir -p raw_tiny
          printf 'agency_id,agency_name,agency_url,agency_timezone\nA,Test,http://e.org,UTC\n' > raw_tiny/agency.txt
          printf 'route_id,route_short_name,route_long_name,route_type\nR1,1,Line 1,1\nR2,2,Line 2,1\n' > raw_tiny/routes.txt
          printf 'trip_id,route_id,service_id\nT1,R1,S\nT2,R2,S\n' > raw_tiny/trips.txt
          # ST1/ST2 are platforms of station ST; P9 is a lone platform elsewhere.
          printf 'stop_id,stop_name,stop_lat,stop_lon,parent_station,location_type\n' > raw_tiny/stops.txt
          printf 'ST1,Central P1,12.97,77.59,ST,0\nST2,Central P2,12.97,77.59,ST,0\nP9,Far,12.99,77.61,,0\n' >> raw_tiny/stops.txt
          printf 'trip_id,arrival_time,departure_time,stop_id,stop_sequence\n' > raw_tiny/stop_times.txt
          printf 'T1,08:00:00,08:00:00,ST1,0\nT1,08:05:00,08:05:00,P9,1\n' >> raw_tiny/stop_times.txt
          printf 'T2,08:10:00,08:10:00,ST2,0\nT2,08:15:00,08:15:00,P9,1\n' >> raw_tiny/stop_times.txt
          printf 'from_stop_id,to_stop_id,transfer_type,min_transfer_time\nST1,ST2,2,45\n' > raw_tiny/transfers.txt

          python3 scripts/normalize_gtfs.py raw_tiny data_tiny --transfers --default-transfer 150
          echo "--- generated transfers.txt ---"; cat data_tiny/transfers.txt

          python3 - <<'EOF'
          import csv, sys
          rows = list(csv.DictReader(open("data_tiny/transfers.txt")))
          got = {(r["from_stop_id"], r["to_stop_id"]): int(r["min_transfer_time"]) for r in rows}
          # Both directions must exist even though the feed only supplied one.
          expected = {("ST1", "ST2"): 45, ("ST2", "ST1"): 150}
          if got != expected:
              sys.exit(f"FATAL: transfers mismatch.\n  got:      {got}\n  expected: {expected}")
          # A station with a single platform must not generate a self-transfer.
          if any(a == b for a, b in got):
              sys.exit("FATAL: self-transfer emitted")
          print("normalize_gtfs.py --transfers: OK")
          EOF

      # ── 5. Cache CMake build artifacts ───────────────────────────────────
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ── 6. Configure (Debug for sanitizers) ─────────────────────────────
      - name: Configure CMake (Debug + ASan)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -G Ninja

      # ── 7. Build ──────────────────────────────────────────────────────────
      - name: Build all targets
        run: cmake --build build --parallel 4

      # ── 8. Run tests ──────────────────────────────────────────────────────
      - name: Run Google Test suite
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --output-on-failure --timeout 60

      # ── 9. FK-drop threshold check ────────────────────────────────────────
      # The parser drops FK-orphaned rows with only a warning. If 80% of
      # stop_times were dropped the graph would be wrong while every test still
      # passed, since the fallback graph kicks in. Fail CI above a 5% drop rate.
      - name: Check GTFS FK-drop rate
        run: |
          python3 - <<'EOF'
          import subprocess, sys, re
          # Read BOTH streams: print_stats() writes to stdout (std::printf), not
          # stderr, so a stderr-only grep matches nothing and this check would
          # silently skip on every run. Anchor on the exact stat labels.
          r = subprocess.run(
              ["./build/routing_engine_benchmark", "./data"],
              capture_output=True, text=True, timeout=60
          )
          out = (r.stdout or "") + "\n" + (r.stderr or "")
          def find(label):
              m = re.search(label + r"\s*:?\s*(\d+)", out)
              return int(m.group(1)) if m else None
          rows_read = find(r"Rows read")
          rows_fk   = find(r"Dropped \(bad FK\)")
          if rows_read and rows_read > 0 and rows_fk is not None:
              rate = rows_fk / rows_read
              print(f"FK-drop rate: {rate:.1%} ({rows_fk}/{rows_read})")
              if rate > 0.05:
                  print(f"FATAL: FK-drop rate {rate:.1%} exceeds 5% threshold.")
                  print("The synthetic GTFS generator produced orphaned FK references.")
                  sys.exit(1)
          else:
              print("No parseable GTFS stats found in output — skipping FK check.")
          EOF

      # ── 10. Release build check (no sanitizers, -O3) ─────────────────────
      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build_release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v3" \
            -G Ninja

      - name: Build release target
        run: cmake --build build_release --target routing_engine_benchmark --parallel 4

      # ── 11. Upload test results ────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/
